<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle smooth shadow for the box -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- White Box with Curved Edges -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="108" 
    ry="108" 
    fill="#FFFFFF" 
    filter="url(#subtle-shadow)"
  />

  <!-- Capital 'U' in Black -->
  <text 
    x="50%" 
    y="52%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    fill="#000000" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-weight="800" 
    font-size="280"
    letter-spacing="-0.02em"
  >U</text>
</svg>
